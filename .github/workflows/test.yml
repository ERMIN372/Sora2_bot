name: Claude Task Executor
   
   on:
     issues:
       types: [opened, labeled]
   
   jobs:
     execute:
       if: contains(github.event.issue.labels.*.name, 'claude-task')
       runs-on: ubuntu-latest
       
       steps:
         - uses: actions/checkout@v4
         
         - name: Parse task
           id: parse
           run: |
             TASK=$(echo "${{ github.event.issue.body }}" | sed -n '/```task/,/```/p' | sed '1d;$d')
             echo "task=$TASK" >> $GITHUB_OUTPUT
         
         - name: Execute with Claude
           env:
             ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
             GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
           run: |
             pip install anthropic PyGithub
             python .github/scripts/execute_task.py \
               --task "${{ steps.parse.outputs.task }}" \
               --issue-number ${{ github.event.issue.number }}
